<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Table Layout Switcher (╯°□°)╯︵┻━┻</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 16px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .status {
        font-size: 11px;
        padding: 6px 8px;
        border-radius: 4px;
        color: var(--figma-color-text-secondary);
        text-align: center;
      }
      .status.error {
        color: var(--figma-color-text-danger, #f24822);
      }
      .toggle {
        display: flex;
        gap: 8px;
      }
      .toggle-btn {
        flex: 1;
        padding: 6px;
        border-radius: 8px;
        border: 2px solid transparent;
        background: var(--figma-color-bg-secondary);
        cursor: pointer;
        transition: border-color 0.15s, opacity 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toggle-btn img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
      }
      .toggle-btn.selected {
        border-color: var(--figma-color-bg-brand, #0d99ff);
        background: var(--figma-color-bg-brand-tertiary, #e5f4ff);
        cursor: default;
      }
      .toggle-btn:not(.selected):hover {
        border-color: var(--figma-color-border-strong);
      }
      .toggle-btn:disabled,
      .toggle-btn.disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .toggle-btn.disabled:hover {
        border-color: transparent;
      }
    </style>
  </head>

    <script>
      const statusEl = document.getElementById("status");
      const rowsBtn = document.getElementById("rowsBtn");
      const colsBtn = document.getElementById("colsBtn");

      function setStatus(kind, rows, cols, error) {
        if (error) {
          statusEl.textContent = error;
          statusEl.className = "status error";
          rowsBtn.className = "toggle-btn disabled";
          colsBtn.className = "toggle-btn disabled";
          return;
        }
        statusEl.textContent = kind === "column-first"
          ? `${cols} columns × ${rows} rows`
          : `${rows} rows × ${cols} columns`;
        statusEl.className = "status";

        const isRows = kind === "row-first";
        rowsBtn.className = "toggle-btn" + (isRows ? " selected" : "");
        colsBtn.className = "toggle-btn" + (!isRows ? " selected" : "");
      }

      rowsBtn.onclick = () => {
        if (!rowsBtn.classList.contains("selected") && !rowsBtn.classList.contains("disabled")) {
          parent.postMessage({ pluginMessage: { type: "switchLayout" } }, "*");
        }
      };
      colsBtn.onclick = () => {
        if (!colsBtn.classList.contains("selected") && !colsBtn.classList.contains("disabled")) {
          parent.postMessage({ pluginMessage: { type: "switchLayout" } }, "*");
        }
      };

      window.onmessage = (event) => {
        const msg = event.data?.pluginMessage;
        if (!msg || msg.type !== "layoutStatus") return;
        setStatus(msg.kind, msg.rows, msg.cols, msg.error);
      };
    </script>
